# Gate de frescura do contrato OpenAPI (next-frontend-openapi-typing/TD-03; saneamento-fase-02-e-infra/TD-06).
# Reproduz sync → gen → diff: falha o PR quando next-frontend/openapi.json ou lib/api/types.gen.ts
# estão defasados em relação a nestjs-project/openapi.json. Não sobe banco nem backend (escopo restrito).
name: openapi-freshness

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: openapi-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-freshness:
    name: openapi.json + types.gen.ts em sincronia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            nestjs-project/package-lock.json
            next-frontend/package-lock.json

      - name: Sync spec (backend → frontend)
        run: bash scripts/sync-openapi.sh

      - name: Install frontend deps
        working-directory: next-frontend
        run: npm ci

      - name: Regenerate types.gen.ts
        working-directory: next-frontend
        run: npm run openapi:types

      - name: Fail on drift
        run: git diff --exit-code -- next-frontend/openapi.json next-frontend/lib/api/types.gen.ts
