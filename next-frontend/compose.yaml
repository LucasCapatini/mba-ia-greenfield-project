services:
  next-frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3001:3000
    volumes:
      - .:/home/node/app
    networks:
      - streamtube

# Rede criada pela stack do backend (nestjs-project/compose.yaml). Suba o backend antes do frontend;
# sem a rede, `docker compose up` falha com "network streamtube declared as external, but could not be found".
networks:
  streamtube:
    external: true
    name: streamtube
